name: CI

# Enterprise reliability gate: every push/PR must apply the full migration
# chain against a fresh database, seed the test tenant, and pass the whole
# backend suite. A red X here blocks merge — the guard against silent
# loader/engine wiring breaks.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uw_user
          POSTGRES_PASSWORD: uw_password
          POSTGRES_DB: riskuw_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U uw_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations (in order)
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "-- $f"
            PGPASSWORD=uw_password psql -h localhost -p 5433 -U uw_user -d riskuw_test -f "$f" -v ON_ERROR_STOP=1
          done

      - name: Seed test tenant + admin
        env:
          DATABASE_URL: postgresql://uw_user:uw_password@localhost:5433/riskuw_test
        run: python3 scripts/ci/seed_test_db.py

      - name: Run backend test suite
        env:
          TEST_DATABASE_URL: postgresql://uw_user:uw_password@localhost:5433/riskuw_test
          TEST_USERNAME: admin
          TEST_PASSWORD: TestPass123!
          JWT_SECRET: ci-test-secret-change-me
        run: python3 -m pytest backend/tests/ -q
