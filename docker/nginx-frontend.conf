# ─────────────────────────────────────────────────────────────────────────────
# docker/nginx-frontend.conf
# Runs INSIDE the riskuw_frontend container on port 80.
# Handles React SPA routing and proxies API calls to riskuw_fastapi:8000
# (container-to-container on riskuw-network — no host port needed).
#
# Keep docker/nginx-frontend.conf and this repo-root copy byte-identical;
# DOCKER_DEPLOY.md scp's this file over the docker/ one on the server.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;  # healthcheck hits localhost (::1); without this the container stays unhealthy
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~* \.(js|css|woff2|woff|ttf|svg|png|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── SPA page routes that share a prefix with API routes ──────────────────
    # A hard refresh (F5) at one of these exact paths must load the app, not be
    # proxied to the backend. The proxy regex below is unanchored at the end, so
    # single-segment paths like /workbench or /sar-config currently get sent to
    # FastAPI and 404/401. Anchor both ends so API calls (/workbench/queue,
    # /sar-config/rules) still fall through to the proxy. The internal redirect
    # to /index.html picks up the no-store headers from the \.html$ block above.
    # Keep in sync with the React Router paths in frontend/src/App.tsx.
    location ~ ^/(workbench|queue|batch|reinsurance|users|tenants|audit|members|sar-config|medical-standards|output-interface|integrations|policy-admin|agent-portal|system-config)/?$ {
        try_files /index.html =404;
    }

    location ~ ^/(uw-scales|workbench|integrations|api-keys|auth|products|underwriting|queue|batch|tenants|users|letter-templates|health|rules|custom-rules|scales|physicians|reinsurance|notifications|reports|docs|redoc|openapi.json|premium-formula|formulas|sar-config|medical-standards|members|gst-config|modal-factor-config|system|audit|aps|output-interface|gst-modal|user-labels|analytics|icd10|agent|policy) {
        set $backend http://fastapi:8000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Forwarded-Method $request_method;
        proxy_read_timeout 120s;
        client_max_body_size 500M;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
