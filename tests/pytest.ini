[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --color=yes
    --durations=10
    -p no:warnings
markers =
    smoke: Quick sanity checks (run first)
    auth: Authentication and RBAC tests
    underwriting: Core UW engine tests
    batch: Batch processing tests
    agent: Agent/Broker portal tests
    workbench: UW Workbench tests
    security: Security and audit tests
    policy: Policy number generation tests
    analytics: Analytics and reporting tests
    slow: Tests that take more than 5 seconds
